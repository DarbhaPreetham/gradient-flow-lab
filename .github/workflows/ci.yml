name: Build, Test & Deploy

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  web:
    name: Web Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run build

      - name: Lint
        run: bun run lint

      - name: Build production bundle
        run: bun run build

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: chromaweave-web
          path: dist

  android:
    name: Android Capacitor Build
    runs-on: ubuntu-latest
    needs: web
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build web bundle
        run: bun run build

      - name: Sync Capacitor Android
        run: bun run capacitor:sync:android

      - name: Upload Android project
        uses: actions/upload-artifact@v4
        with:
          name: chromaweave-android
          path: android

  # iOS project generation requires macOS + Xcode for actual builds,
  # but we can at least validate the web bundle and Capacitor sync here.
  ios:
    name: iOS Capacitor Sync Check
    runs-on: macos-latest
    needs: web
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build web bundle
        run: bun run build

      - name: Sync Capacitor iOS
        run: bun run capacitor:sync:ios

      - name: Upload iOS project
        uses: actions/upload-artifact@v4
        with:
          name: chromaweave-ios
          path: ios
